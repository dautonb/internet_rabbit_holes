name: Internet Rabbit Hole

on:
  schedule:
    # 08:00 in Vietnam (UTC+7) == 01:00 UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic to investigate (leave empty to choose one)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: internet-rabbit-hole
  cancel-in-progress: false

jobs:
  rabbit-hole:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Explore today's rabbit hole
        env:
          ORTHOGONAL_API_KEY: ${{ secrets.ORTHOGONAL_API_KEY }}
          RABBIT_HOLE_TOPIC: ${{ inputs.topic }}
          MAX_RESULTS: "5"
          ORTHOGONAL_SEARCH_API: "tavily"
          ORTHOGONAL_SEARCH_PATH: "/search"
          ORTHOGONAL_SEARCH_DEPTH: "basic"
        run: python scripts/rabbit_hole.py

      - name: Commit journal entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal data/history.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "🐇 daily rabbit hole: $(date -u +'%Y-%m-%d')"
            git push
          fi
